<div class="app-shell">

  <header class="top-header">
    <div class="header-left">
      <div class="brand-icon">📦</div>
      <div class="brand-text">
        <h2>SIMS</h2>
        <p>Smart Inventory Management System</p>
      </div>
    </div>

    <div class="header-right">
      <login-button></login-button>
    </div>
  </header>

  @if (user()) {
    <nav class="top-nav">
      <a routerLink="/Dashboard" routerLinkActive="active-link">Dashboard</a>
      <a routerLink="/BohPage" routerLinkActive="active-link">BOH/Order</a>
      <a routerLink="/OrderHistoryPage" routerLinkActive="active-link">Placed Orders</a>
      <a routerLink="/MovementPage" routerLinkActive="active-link">Movement</a>
      <a routerLink="/AlertsPage" routerLinkActive="active-link" class="nav-alert-link">
        Alerts
        @if (alertCount() > 0) {
          <span class="nav-alert-badge">{{ alertCount() }}</span>
        }
      </a>
      <a routerLink="/ChatPage" routerLinkActive="active-link">AI Assistant</a>
    </nav>
  }

  <main class="page-content">
    <router-outlet></router-outlet>
  </main>

</div>

<style>
  .nav-alert-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .nav-alert-badge {
    min-width: 20px;
    height: 20px;
    padding: 0 6px;
    border-radius: 999px;
    background: #ef4444;
    color: white;
    font-size: 11px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
</style>
