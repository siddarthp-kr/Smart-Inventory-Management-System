<style>
  /* PAGE BACKGROUND */
  body {
    background: linear-gradient(135deg, #eff6ff, #f8fafc);
  }

  /* LOGIN CARD */
  .login-page {
    width: 360px;
    padding: 28px 26px;
    margin: 80px auto;

    background: white;
    border-radius: 16px;

    border: 1px solid #e5e7eb;
    box-shadow: 0 12px 35px rgba(15, 23, 42, 0.08);

    font-family: "Inter", "Segoe UI", Arial, sans-serif;
  }

  /* TITLE */
  .login-page h2 {
    margin: 0 0 6px;
    text-align: center;
    font-size: 24px;
    font-weight: 700;
    color: #111827;
  }

  /* SUBTEXT */
  .login-page::after {
    display: block;
    text-align: center;
    font-size: 13px;
    color: #6b7280;
    margin-bottom: 18px;
  }

  /* FORM FIELDS */
  .form-field {
    margin-bottom: 18px;
    display: flex;
    flex-direction: column;
  }

  .form-field label {
    margin-bottom: 6px;
    font-size: 13px;
    font-weight: 600;
    color: #374151;
  }

  /* INPUTS */
  .form-field input {
    padding: 12px 12px;

    border: 1px solid #d1d5db;
    border-radius: 10px;

    font-size: 14px;

    transition: all 0.2s ease;
  }

  /* HOVER */
  .form-field input:hover {
    border-color: #9ca3af;
  }

  /* FOCUS */
  .form-field input:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    outline: none;
  }

  /* ERROR */
  .error-message {
    color: #dc2626;
    font-size: 13px;
    margin-bottom: 12px;
    text-align: center;
    font-weight: 500;
  }

  /* BUTTON */
  button {
    width: 100%;
    padding: 12px;

    background: linear-gradient(135deg, #2563eb, #3b82f6);
    color: white;

    border: none;
    border-radius: 10px;

    font-size: 15px;
    font-weight: 600;

    cursor: pointer;
    transition: all 0.2s ease;

    box-shadow: 0 6px 15px rgba(37, 99, 235, 0.25);
  }

  /* BUTTON HOVER */
  button:hover {
    background: linear-gradient(135deg, #1e40af, #2563eb);
    transform: translateY(-1px);
  }

  /* OPTIONAL: subtle input placeholder styling */
  input::placeholder {
    color: #9ca3af;
  }

</style>

<div class="login-page">
  <h2>Login</h2>

  <div class="form-field">
    <label for="userId">User ID</label>
    <input
      type="text"
      id="userId"
      [(ngModel)]="euid"
      placeholder="Enter your EUID"
    />
  </div>

  <div class="form-field">
    <label for="division">Division Number</label>
    <input
      type="text"
      id="division"
      [(ngModel)]="divisionNumber"
      placeholder="Enter your Division Number"/>
  </div>

  <div class="form-field">
    <label for="storeNumber">Store Number</label>
    <input
      type="text"
      id="storeNumber"
      [(ngModel)]="storeNumber"
      placeholder="Enter your Store Number"/>

  </div>


  @if (loginError !== ''){
    <div class = "error-message"> {{loginError}} </div>
  }

  <button type="button" (click)="onLogin()">Login</button>
</div>
