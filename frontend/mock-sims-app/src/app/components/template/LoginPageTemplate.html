<style>
  .login-page {
    width: 300px;
    padding: 20px;
    margin: 50px auto;
    border: 1px solid #ccc;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    font-family: Arial, sans-serif;
  }

  .login-page h2 {
    margin-top: 0;
    text-align: center;
  }

  .form-field {
    margin-bottom: 15px;
    display: flex;
    flex-direction: column;
  }

  .form-field label {
    margin-bottom: 5px;
    font-weight: bold;
  }

  .form-field input {
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 14px;
  }

  .readonly-field {
    background-color: #f0f0f0;
    color: #666;
  }

  .error-message {
    color: red;
    font-size: 13px;
    margin-top: 10px;
    text-align: center;
  }

  button {
    width: 100%;
    padding: 10px;
    background-color: #007bff;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 16px;
    cursor: pointer;
  }

  button:hover {
    background-color: #0056b3;
  }

</style>

<div class="login-page">
  <h2>Login</h2>

  <div class="form-field">
    <label for="userId">User ID</label>
    <input
      type="text"
      id="userId"
      [(ngModel)]="euid"
      placeholder="Enter your EUID"
    />
  </div>

  <div class="form-field">
    <label for="storeNumber">Store Number</label>
    <input
      type="text"
      id="storeNumber"
      [(ngModel)]="storeNumber" />
<!--      readonly-->
<!--      class = "readonly-field"-->
<!--    />-->
  </div>

  <div class="form-field">
    <label for="division">Division Number</label>
    <input
      type="text"
      id="division"
      [(ngModel)]="divisionNumber" />
<!--      readonly-->
<!--      class = "readonly-field"-->
<!--    />-->
  </div>

  @if (loginError !== ''){
    <div class = "error-message"> {{loginError}} </div>
  }

  <button type="button" (click)="onLogin()">Login</button>
</div>
