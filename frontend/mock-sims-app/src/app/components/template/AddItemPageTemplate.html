<div class = "add-item-container">
  <div class="header-bar">
    <h2>Add Item</h2>
    <button routerLink="/BohPage">Back to Ordering</button>
  </div>
  @if (message !== '' && isSuccess){
    <div class = "message-box success">
      {{ message }}
    </div>
  }

  @if (message !== '' && !isSuccess){
    <div class = "message-box invalid">
      {{ message }}
    </div>
  }

  <div class = "form-grid">
    <div class = "form-group">
      <label>UPC Number</label>
      <input type = "text" [(ngModel)] = "upcNumber" placeholder="Enter UPC Number" [class.invalid-field] = "invalidUpcNumber" />
    </div>


    <div class="form-group subcommodity-group">
      <label>Subcommodity Number</label>
      <input type="text" [(ngModel)]="subcommodityNumber" (ngModelChange)="onSubcommodityInput()" placeholder="Enter or search Subcommodity Number" [class.invalid-field]="invalidSubcommodityNumber"/>

      @if (matchingSubcommodities.length > 0) {
        <div class="subcommodity-dropdown">
          @for (rule of matchingSubcommodities; track rule.subcommodityNumber) {
            <button type="button" class="subcommodity-option" (click)="selectSubcommodityRule(rule)">
              <span class="subcommodity-code">{{ rule.subcommodityNumber }}</span>

              @if (rule.canBeMarkedDown) {
                <span class="rule-pill eligible">Markdown Eligible</span>
              } @else {
                <span class="rule-pill not-eligible">Not Markdown Eligible</span>
              }
            </button>
          }
        </div>
      }
    </div>

    <div class="form-group">
      <label>Department</label>
      <select
        [(ngModel)]="departmentNumber"
        [class.invalid-field]="invalidDepartmentNumber"
      >
        <option value="">Select Department</option>
        @for (dept of departmentInfo; track dept.departmentNumber) {
          <option [value]="dept.departmentNumber">
            {{ dept.departmentNumber }} {{ dept.departmentName }}
          </option>
        }
      </select>
    </div>

    <div class = "form-group">
      <label>Product Name</label>
      <input type = "text" [(ngModel)] = "productName" placeholder="Enter Product Name" [class.invalid-field] = "invalidProductName"/>
    </div>

    <div class = "form-group">
      <label>Standard Price</label>
      <input type = "number" [(ngModel)] = "standardPrice" placeholder="Enter Standard Price" [class.invalid-field] = "invalidStandardPrice" />
    </div>

    <div class="form-group">
      <label>Can Be Marked Down</label>
      <select
        [(ngModel)]="canBeMarkedDown"
        (ngModelChange)="onCanBeMarkedDownChange()"
        [disabled]="isExistingSubcommodityRule"
        [class.disabled-field]="isExistingSubcommodityRule"
      >
        <option [ngValue]="false">No</option>
        <option [ngValue]="true">Yes</option>
      </select>
    </div>

    <div class = "form-group">
      <label>First Markdown Percent</label>
      <input type = "number" [(ngModel)] = "firstMarkdownPercent" placeholder="Enter Markdown Percent" [disabled]="isExistingSubcommodityRule || !canBeMarkedDown" [class.disabled-field]="isExistingSubcommodityRule || !canBeMarkedDown" [class.invalid-field]="invalidFirstMarkdownPercent"/>
    </div>


    <div class = "form-group">
      <label>Days Before Expiration To Markdown</label>
      <input type = "number" [(ngModel)] = "daysBeforeExpToMD" placeholder="Enter days" [disabled]="isExistingSubcommodityRule || !canBeMarkedDown" [class.disabled-field]="isExistingSubcommodityRule || !canBeMarkedDown" [class.invalid-field]="invalidDaysBeforeExpToMD" />
    </div>

    <div class = "form-group">
      <label>Days Before Expiration To RFI</label>
      <input type = "number" [(ngModel)] = "daysBeforeExpToRFI" placeholder="Enter days" [disabled]="isExistingSubcommodityRule || !canBeMarkedDown" [class.disabled-field]="isExistingSubcommodityRule || !canBeMarkedDown" [class.invalid-field]="invalidDaysBeforeExpToRFI" />
    </div>

    <div class = "form-group">
      <label>Days After Order To Set Expiration</label>
      <input type = "number" [(ngModel)] = "daysAfterOrderToSetExp" placeholder="Enter days" [disabled]="isExistingSubcommodityRule || !canBeMarkedDown" [class.disabled-field]="isExistingSubcommodityRule || !canBeMarkedDown" [class.invalid-field]="invalidDaysAfterOrderToSetExp"/>
    </div>
  </div>

  <div class = "actions">
    <button (click) = "addItemAction()">Add Item</button>
  </div>
</div>

<style>
  /* Container (MAIN IMPROVEMENT) */
  .add-item-container {
    max-width: 900px;
    margin: 30px auto;
    background: white;
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
    border: 1px solid #e5e7eb;
  }

  /* Header */
  .header-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
  }

  .header-bar h2 {
    margin: 0;
    font-size: 26px;
    font-weight: 700;
    color: #111827;
  }

  /* Back button */
  .header-bar button {
    background: white;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    padding: 10px 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.18s ease;
  }

  .header-bar button:hover {
    background: #f3f4f6;
  }

  /* Form Grid */
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 25px;
  }

  /* Form Groups */
  .form-group {
    display: flex;
    flex-direction: column;
  }

  .form-group label {
    margin-bottom: 6px;
    font-size: 13px;
    font-weight: 600;
    color: #374151;
  }

  /* Inputs / Selects */
  .form-group input,
  .form-group select {
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid #d1d5db;
    font-size: 14px;
    outline: none;
    transition: all 0.2s ease;
  }

  /* Hover */
  .form-group input:hover,
  .form-group select:hover {
    border-color: #9ca3af;
  }

  /* Focus */
  .form-group input:focus,
  .form-group select:focus {
    border-color: #5b5de6;
    box-shadow: 0 0 0 3px rgba(91, 93, 230, 0.15);
  }

  /* Disabled */
  .disabled-field {
    background-color: #f9fafb !important;
    color: #9ca3af !important;
    cursor: not-allowed;
  }

  /* Validation */
  .invalid-field {
    border-color: #ef4444 !important;
    box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.1);
  }

  .subcommodity-dropdown {
    position: absolute;
    top: 72px;
    left: 0;
    right: 0;
    z-index: 20;
    background: white;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
    overflow: hidden;
  }

  .subcommodity-option {
    width: 100%;
    background: white;
    border: none;
    border-bottom: 1px solid #f3f4f6;
    padding: 10px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    text-align: left;
  }

  .subcommodity-option:hover {
    background: #f9fafb;
  }

  .subcommodity-code {
    font-family: monospace;
    font-weight: 700;
    color: #111827;
  }
  .subcommodity-group {
    position: relative;
  }

  .rule-pill {
    font-size: 11px;
    font-weight: 700;
    border-radius: 999px;
    padding: 4px 8px;
  }

  .rule-pill.eligible {
    background: #dcfce7;
    color: #166534;
  }

  .rule-pill.not-eligible {
    background: #f3f4f6;
    color: #4b5563;
  }

  .helper-text {
    margin: 6px 0 0;
    font-size: 12px;
    line-height: 1.4;
  }

  .existing-rule-text {
    color: #166534;
  }

  .new-rule-text {
    color: #6b7280;
  }

  /* Action Button */
  .actions {
    margin-top: 10px;
    display: flex;
    justify-content: flex-start;
  }

  .actions button {
    background: dodgerblue;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 2px 8px rgba(91, 93, 230, 0.2);
  }

  .actions button:hover {
    background: darkblue;
    transform: translateY(-1px);
  }

  /* Messages */
  .message-box {
    margin-bottom: 15px;
    padding: 12px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
  }

  .success {
    background-color: #ecfdf5;
    border: 1px solid #10b981;
    color: #065f46;
  }

  .invalid {
    background-color: #fef2f2;
    border: 1px solid #ef4444;
    color: #7f1d1d;
  }

</style>
