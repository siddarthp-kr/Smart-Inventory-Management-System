spring:
  application:
    name: mock-sims-backend

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console


  sql:
    init:
      mode: always
      schema-locations: classpath:mock-sims-schema-h2.sql
      data-locations: classpath:mock-sims-data-h2.sql