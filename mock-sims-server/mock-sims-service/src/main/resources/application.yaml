spring:
  application:
    name: mock-sims-backend
  devtools:
    restart:
      enabled: false


  datasource:
    url: jdbc:h2:mem:testdb;
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console


  sql:
    init:
      mode: always
      schema-locations: classpath:mock-sims-schema-h2.sql
      data-locations: classpath:mock-sims-data-h2.sql

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: ${https://api-internal.8451.com/ai/proxy/}
      chat:
        options:
          model: gpt-4o
